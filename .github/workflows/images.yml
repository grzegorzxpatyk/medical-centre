# Builds the three production images and pushes them to GHCR, so the VPS only
# ever pulls. Building on a 4 GB server is slow and Next.js can OOM there.
#
# Images produced (all under ghcr.io/<owner>/<repo>/):
#   cms        — slim Payload runtime
#   cms-tools  — full build stage, runs `payload migrate` and `pnpm seed`
#   web        — slim frontend runtime
#
# One repository variable is required: NEXT_PUBLIC_CMS_URL (Settings →
# Secrets and variables → Actions → Variables), e.g. https://cms.example.pl.
# It is inlined into the web bundle at build time, so changing it needs a
# rebuild, not just a restart.
name: Build images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't let one failing image cancel the others — a partial push is
      # easier to reason about than three half-finished jobs.
      fail-fast: false
      matrix:
        include:
          - name: cms
            dockerfile: apps/cms/Dockerfile
            target: runner
            cache_scope: cms
          - name: cms-tools
            dockerfile: apps/cms/Dockerfile
            target: migrator
            cache_scope: cms
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runner
            cache_scope: web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CMS_URL=${{ vars.NEXT_PUBLIC_CMS_URL }}
          # cms and cms-tools come from the same Dockerfile and share every
          # stage up to the build, hence the shared scope.
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
