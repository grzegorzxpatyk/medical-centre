# Production: Caddy + Postgres + CMS + frontend.
#
# Building on the host (small VPS, slow):
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Using images built by CI (the normal path — see .github/workflows/images.yml):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Every service carries both `image:` and `build:`, so the same file works
# either way: `pull` fetches from the registry, `up --build` builds locally.
# Separate project name so containers/volumes never collide with the dev stack.
name: medical-centre-prod

services:
  # Terminates TLS for both hostnames. The only service bound to the host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      CMS_DOMAIN: ${CMS_DOMAIN:?set CMS_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Losing this volume means re-issuing
      # from Let's Encrypt, which is rate limited — back it up or expect a wait.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - cms

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: ${POSTGRES_DB:-medical_centre}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Builds the image that cms-seed also runs — it is the full build stage
  # (~2 GB), so building it twice would be pure waste.
  cms-migrate:
    image: ${REGISTRY:-medical-centre}/cms-tools:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      target: migrator
    command: ['pnpm', 'payload', 'migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-medical_centre}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Bootstraps the practice's content. Safe to run on every deploy: it skips
  # anything already in the database, so it never reverts an editor's work.
  # Set SEED_FORCE=1 to re-assert the canonical content and drop extras.
  # Reuses the image cms-migrate builds — deliberately no build section of its
  # own, because two services building the same tag race on the image export.
  cms-seed:
    image: ${REGISTRY:-medical-centre}/cms-tools:${IMAGE_TAG:-latest}
    command: ['pnpm', 'seed']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-medical_centre}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      SEED_FORCE: ${SEED_FORCE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      cms-migrate:
        condition: service_completed_successfully
    restart: 'no'

  cms:
    image: ${REGISTRY:-medical-centre}/cms:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-medical_centre}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Behind a TLS-terminating proxy Payload cannot infer its own origin, so
      # media URLs would come out as http://cms:3001/... and next/image would
      # reject them. Same value the web bundle is built with.
      CMS_PUBLIC_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:3001}
    expose:
      - '3001'
    volumes:
      - cms_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      cms-seed:
        condition: service_completed_successfully

  web:
    image: ${REGISTRY:-medical-centre}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      # Server-side requests go over the docker network
      CMS_URL: http://cms:3001
      # Defaults to "not indexable" so preview deploys never leak into Google
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    expose:
      - '3000'
    depends_on:
      - cms

volumes:
  pgdata:
  cms_media:
  caddy_data:
  caddy_config:
